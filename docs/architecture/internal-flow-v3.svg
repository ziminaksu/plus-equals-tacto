<text x="1248" y="611.1" fill="#536F6A" font-family="Arial,sans-serif" font-size="19" font-weight="400">Policy + terms</text>
<polyline points="1012,780 968,780" fill="none" stroke="#173B39" stroke-width="3" stroke-linejoin="round"/><polygon points="968,780 978.5309907426845,774.2468935367496 978.5309907426845,785.7531064632504" fill="#173B39"/>
