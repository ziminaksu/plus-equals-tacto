<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1110" viewBox="0 0 1500 1110"><rect width="100%" height="100%" fill="#F7FAF7"/>
<text x="55" y="46.0" fill="#536F6A" font-family="Arial,sans-serif" font-size="20" font-weight="700">+= / TACTO / INTERNAL DESIGN v3</text>
<text x="55" y="101.2" fill="#173B39" font-family="Arial,sans-serif" font-size="38" font-weight="700">Learn trade-offs. Choose pressure. Measure results.</text>
<text x="55" y="141.8" fill="#536F6A" font-family="Arial,sans-serif" font-size="22" font-weight="400">Proposed architecture • numerical starting assumptions are tested, not treated as supplier facts.</text>
<rect x="55" y="172" width="1390" height="92" rx="18" fill="#173B39"/>
<text x="78" y="201.3" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="17" font-weight="700">FIXED BUYER RULES + SOURCE EVIDENCE</text>
<text x="78" y="238.7" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="23" font-weight="400">Case constraints / cost rates / fallback + supplier quotes / history / contracts / replies</text>
<rect x="55" y="325" width="430" height="230" rx="18" fill="#E3EEF7"/>
<text x="77" y="359.3" fill="#536F6A" font-family="Arial,sans-serif" font-size="17" font-weight="700">01   QWEN 27B → 2.4T IF AMBIGUOUS</text>
<text x="77" y="404.1" fill="#173B39" font-family="Arial,sans-serif" font-size="29" font-weight="700">Extract decision evidence</text>
<text x="77" y="448.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="400">Terms + source IDs + alternatives</text>
<text x="77" y="480.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="400">Flag contradictions and missing facts</text>
<text x="77" y="512.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="400">OUT: validated structured evidence</text>
<rect x="535" y="325" width="430" height="230" rx="18" fill="#DDF2CD"/>
<text x="557" y="359.3" fill="#536F6A" font-family="Arial,sans-serif" font-size="17" font-weight="700">02   PYTHON / WEIGHTED SCENARIOS</text>
<text x="557" y="404.1" fill="#173B39" font-family="Arial,sans-serif" font-size="29" font-weight="700">Update coefficients</text>
<text x="557" y="448.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="400">r: floor; b_pay / b_term / b_flex</text>
<text x="557" y="480.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="400">Each has a range + evidence history</text>
<text x="557" y="512.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="400">OUT: plausible supplier scenarios</text>
<rect x="1015" y="325" width="430" height="230" rx="18" fill="#DDF2CD"/>
<text x="1037" y="359.3" fill="#536F6A" font-family="Arial,sans-serif" font-size="17" font-weight="700">03   PYTHON / CANDIDATE SEARCH</text>
<text x="1037" y="404.1" fill="#173B39" font-family="Arial,sans-serif" font-size="29" font-weight="700">Compare complete offers</text>
<text x="1037" y="448.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="400">Predict accept / counter / walk-away</text>
<text x="1037" y="480.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="400">Total cost + continuation + downside</text>
<text x="1037" y="512.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="400">OUT: selected terms and pressure</text>
<rect x="1015" y="665" width="430" height="230" rx="18" fill="#E3EEF7"/>
<text x="1037" y="699.3" fill="#536F6A" font-family="Arial,sans-serif" font-size="17" font-weight="700">04   QWEN 27B + PYTHON CHECKS</text>
<text x="1037" y="744.1" fill="#173B39" font-family="Arial,sans-serif" font-size="29" font-weight="700">Write and send</text>
<text x="1037" y="788.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="400">Writer preserves selected terms</text>
<text x="1037" y="820.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="400">Validate facts, constraints, offer IDs</text>
<text x="1037" y="852.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="400">OUT: Arena action + prediction log</text>
<rect x="535" y="665" width="430" height="230" rx="18" fill="#FFFFFF"/>
<text x="557" y="699.3" fill="#536F6A" font-family="Arial,sans-serif" font-size="17" font-weight="700">05   ARENA → QWEN → PYTHON</text>
<text x="557" y="744.1" fill="#173B39" font-family="Arial,sans-serif" font-size="29" font-weight="700">Read actual response</text>
<text x="557" y="788.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="400">Extract choices, counters and claims</text>
<text x="557" y="820.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="400">Separate terminal from open states</text>
<text x="557" y="852.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="400">OUT: observation with source text</text>
<rect x="55" y="665" width="430" height="230" rx="18" fill="#FCE9CE"/>
<text x="77" y="699.3" fill="#536F6A" font-family="Arial,sans-serif" font-size="17" font-weight="700">06   PYTHON / CAUTIOUS UPDATE</text>
<text x="77" y="744.1" fill="#173B39" font-family="Arial,sans-serif" font-size="29" font-weight="700">Learn from the difference</text>
<text x="77" y="788.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="400">Reweight scenarios from observations</text>
<text x="77" y="820.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="400">Track errors; avoid duplicate evidence</text>
<text x="77" y="852.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="400">OUT: next version of coefficients</text>
