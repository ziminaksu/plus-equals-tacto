<polyline points="270,662 270,612 750,612 750,558" fill="none" stroke="#AE6925" stroke-width="3" stroke-linejoin="round"/><polygon points="750,558 755.7531064632504,568.5309907426845 744.2468935367496,568.5309907426845" fill="#AE6925"/>
<text x="310" y="595.8" fill="#915820" font-family="Arial,sans-serif" font-size="22" font-weight="700">Updated beliefs → next decision</text>
<rect x="55" y="934" width="1390" height="77" rx="18" fill="#173B39"/>
<text x="78" y="962.3" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="17" font-weight="700">SQLITE / REPRODUCIBLE ROUND LOG</text>
<text x="78" y="995.8" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="22" font-weight="400">Sources • coefficients + ranges • candidates • predicted outcomes • chosen action • reply • cost</text>
<text x="55" y="1055.7" fill="#173B39" font-family="Arial,sans-serif" font-size="23" font-weight="700">Accepted / walked away → save outcome → compare policies on held-out practice runs.</text>
<text x="55" y="1090.1" fill="#536F6A" font-family="Arial,sans-serif" font-size="19" font-weight="400">No live trial here. No push. Entire must capture the actual development session before submission.</text>
