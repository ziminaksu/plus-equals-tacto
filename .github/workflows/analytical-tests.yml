name: Analytical agent offline regression

on:
  push:
    branches: [main, codex/ksu-stability-trades]
  pull_request:
    paths:
      - "hollerau/**"
      - "arena_kit/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/analytical-tests.yml"

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LLM_PROVIDER: ""
      LLM_API_KEY: ""
      HF_TOKEN: ""
      ARENA_API_KEY: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      AZURE_OPENAI_KEY: ""
      ARENA_TEST_URL: ""
      ARENA_TEST_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --group dev --extra sim --extra mcp
      - name: Run offline tests (no Arena or paid model calls)
        run: uv run pytest -q
