name: Analytical agent offline regression

on:
  push:
    branches: [codex/bayesian-qwen-agent]
  pull_request:
    paths:
      - "hollerau/**"
      - "arena_kit/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/analytical-tests.yml"

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LLM_PROVIDER: ""
      LLM_API_KEY: ""
      HF_TOKEN: ""
      ARENA_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --group dev
      - name: Run offline tests (no Arena or paid model calls)
        run: uv run pytest -q

  credentials-preflight:
    # Only same-repository PRs; never pass credentials to forked PRs.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check secret presence without exposing values or making network calls
        env:
          ARENA_CONFIGURED: ${{ secrets.ARENA_API_KEY != '' }}
          OPENAI_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$ARENA_CONFIGURED" = true ]; then
            echo "Arena API key: OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Arena API key: MISSING" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$OPENAI_CONFIGURED" = true ]; then
            echo "OpenAI API key: OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "OpenAI API key: MISSING" >> "$GITHUB_STEP_SUMMARY"
          fi
